[project]
name = "nabe"
version = "0.1.4"
description = "Devices on the LAN by MAC, with every IPv4 and IPv6 address seen for them"
authors = [{ name = "godric" }]
requires-python = ">=3.15,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.6,<0.18",
]

[tool.uv]
package = false

[tool.pytest]
pythonpath = ["."]
testpaths = ["test"]

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", # Types annotations
    "D", # Docstrings
    "CPY", # Copyright notice
]

[tool.ruff.lint.extend-per-file-ignores]
"test/**/*.py" = [
  "S101", # assert
  "PLR2004", # magic-value-comparison
]
